<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo App</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<main class="todo-card">
    <h1 class="app-title">Todo App</h1>

    <div class="input-row">
        <input type="text" id="todo-input" placeholder="What needs doing?" autofocus />
        <button id="add-btn">Add</button>
    </div>

    <div class="subheader-row">
        <span class="hint-text">Tip: double-click a todo to edit. Press Enter to save.</span>
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
    </div>

    <ul id="todo-list" class="todo-list"></ul>

    <div class="footer-row">
        <span id="items-left">0 items left</span>
        <div class="footer-actions">
            <button id="clear-completed-btn" class="secondary-btn">Clear completed</button>
            <button id="clear-all-btn" class="secondary-btn">Clear all</button>
        </div>
    </div>
</main>

<script src="app.js"></script>
</body>
</html>
